<style>
/* Layout: field-book workspace – top bar, form column, sticky live-value column (bottom bar on phones) */
:root{
  --bg:#f2f5f4;--surface:#ffffff;--soft:#e7efed;--ink:#17222c;--muted:#5a6772;--line:#d6dedc;
  --accent:#0f6e64;--accent-ink:#ffffff;--red:#b3261e;--amber:#8f5d00;--green:#2d7438;--blue:#2b5ea7;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;--f-num:"IBM Plex Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1416;--surface:#162024;--soft:#1c2a2d;--ink:#e2e9e7;--muted:#95a4a8;--line:#2a383c;--accent:#4db3a5;--accent-ink:#06201d;--red:#f07167;--amber:#e3ac4c;--green:#72c482;--blue:#81a9ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1416;--surface:#162024;--soft:#1c2a2d;--ink:#e2e9e7;--muted:#95a4a8;--line:#2a383c;--accent:#4db3a5;--accent-ink:#06201d;--red:#f07167;--amber:#e3ac4c;--green:#72c482;--blue:#81a9ea;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:600 17px var(--f-disp);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
#nav{display:flex;gap:4px}
.nav{font:500 14px var(--f-body);background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:var(--r);cursor:pointer}
.nav.on{color:var(--ink);background:var(--soft)}
.nav:disabled{opacity:.4;cursor:default}
#savestate{margin-left:auto;font-size:12px;color:var(--muted)}#savestate[data-bad="1"]{color:var(--red)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.has-live .layout{grid-template-columns:minmax(0,1fr) 250px}
#view{min-width:0}
h1{font:600 26px/1.2 var(--f-disp);margin:0;text-wrap:balance}
h3{font:600 13px var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 10px}
.sub,.note{color:var(--muted);margin:4px 0 10px;font-size:13px;max-width:70ch}
.eyebrow{font:500 12px var(--f-body);color:var(--muted);margin:0 0 4px;letter-spacing:.02em}
.btn{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-ghost{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.mini{font:500 12px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:2px 7px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.case-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-block;font:500 11px var(--f-body);padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--muted);margin-right:4px;white-space:nowrap}
.c-blue{color:var(--blue)}.c-amber{color:var(--amber)}.c-teal{color:var(--accent)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-grey{color:var(--muted)}
/* register */
.reg-head,.case-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}.kpi b{display:block;font:600 22px var(--f-num);margin:4px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.kpi small{color:var(--muted);font-size:12px}
.spark{width:100%;height:58px;display:block}.spark rect{fill:var(--accent)}.spark text{font:10px var(--f-body);fill:var(--muted);text-anchor:middle}.spark text.v{fill:var(--ink);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input{flex:1 1 220px;min-width:0}
.fchip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 11px;border-radius:20px;cursor:pointer}
.fchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.case-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.case-row{display:grid;grid-template-columns:110px minmax(0,2fr) minmax(0,1.3fr) 130px minmax(0,1.2fr);gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.case-row:last-child{border-bottom:0}.case-row:hover{background:var(--soft)}
.case-row small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-ref{font:500 12px var(--f-num);color:var(--muted)}.cr-val{font:600 14px var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.cr-bank{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}.empty b{color:var(--ink);display:block;margin-bottom:4px}.empty.ok b{color:var(--green)}
/* case */
.head-acts{display:flex;gap:8px;flex-wrap:wrap}
.head-acts select{width:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:thin}
.tab{font:500 14px var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab i,.live-checks i{font-style:normal;font-size:11px;padding:1px 6px;border-radius:10px;background:var(--soft);margin-left:3px}
i.red{color:var(--red)}i.amb{color:var(--amber)}i.grn{color:var(--green)}i.n{color:var(--muted)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}.fld.wide,.grid>.wide{grid-column:1/-1}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:500}.fld em{font-style:normal;opacity:.75}
.fld small{color:var(--muted);font-size:12px}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-width:0}
input[data-num]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
textarea{resize:vertical;line-height:1.5}
.geo{flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
.lnk{color:var(--accent);font-weight:500}
.confirm{background:var(--surface);border:1px solid var(--red);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.warnbox{border-color:var(--amber)}
.tblwrap{overflow-x:auto;margin-bottom:10px}
table.calc{border-collapse:collapse;width:100%;font-size:13px}
table.calc th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.calc td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.calc th.r{text-align:right}
td.num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.num small{display:block;color:var(--red);font-family:var(--f-body)}
td.fx{color:var(--muted);font-size:12px}
table.trace tr.g th{color:var(--accent);font:600 12px var(--f-disp);text-transform:uppercase;letter-spacing:.07em;padding-top:12px}
.cell{padding:4px 6px;font-size:13px;width:100%;min-width:80px}.cell.w{min-width:140px}.cell.s{min-width:56px;width:64px}
tr.out td{opacity:.55}
.empty-row{color:var(--muted);text-align:center}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);align-items:flex-end}
.stats span{display:block;font-size:12px;color:var(--muted)}.stats b{font:600 16px var(--f-num)}.stats b.red{color:var(--red)}
.stats .sug{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.valtop{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}.valtop>div{flex:1 1 150px}.valtop>.big{flex:2 1 300px}
.valtop>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.valtop span{display:block;font-size:12px;color:var(--muted)}.valtop b{display:block;font:600 18px var(--f-num);margin-top:2px;overflow-wrap:anywhere}
.valtop .big{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.valtop .big span,.valtop .big small{color:inherit;opacity:.85}.valtop .big b{font-size:26px}
.valtop small{display:block;font-size:12px;color:var(--muted)}
ul.checks{list-style:none;padding:0;margin:0}ul.checks li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0 8px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--line)}
ul.checks li.error{border-left-color:var(--red)}ul.checks li.warn{border-left-color:var(--amber)}ul.checks li.info{border-left-color:var(--blue)}
.ph-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.busy{font-size:13px;color:var(--muted)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ph{margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.ph-img{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;max-width:100%}
.ph-img img{max-width:100%;max-height:100%;object-fit:contain}
.ph figcaption{padding:8px;display:flex;flex-direction:column;gap:6px}.ph figcaption small{color:var(--muted);font-size:11.5px}
.ph-acts{display:flex;gap:4px}
.out .btn{margin-top:4px}details{margin-top:10px;font-size:13px}summary{cursor:pointer;color:var(--muted)}
/* live value column */
#live{position:sticky;top:76px;align-self:start;min-width:0}
.live-in{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.live-in .lbl{font-size:12px;color:var(--muted)}.live-in .sheet{font-family:var(--f-num)}
.fmv{font:600 24px var(--f-num);color:var(--accent);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.live-in dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:4px 0;font-size:13px}.live-in dt{color:var(--muted)}.live-in dd{margin:0;text-align:right;font-family:var(--f-num)}
.live-checks{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:1060px){
  body.has-live .layout{grid-template-columns:minmax(0,1fr)}
  #live{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
  .live-in{border-radius:0;border-width:1px 0 0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .live-in dl,.live-in .sheet{display:none}.fmv{font-size:18px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .case-row{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .cr-ref{grid-column:1/-1}.cr-bank{grid-column:1}.cr-val{grid-row:2;grid-column:2}.cr-st{grid-column:1/-1}
  h1{font-size:22px}
  .stats .sug{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>/* ===== Valuation Studio – calculation engine (pure, no DOM) ===== */
const VS = (typeof window !== 'undefined' ? (window.VS = window.VS || {}) : {});

VS.BANKS = [
  ['Indian Overseas Bank', 'IOB'], ['Union Bank of India', 'IOB'], ['Bank of Baroda', 'IOB'], ['Central Bank of India', 'IOB'],
  ['Maharashtra Gramin Bank', 'IOB'], ['IDBI Bank', 'IOB'], ['Bank of India', 'IOB'], ['Bank of Maharashtra', 'BOM'],
  ['State Bank of India', 'BOM'], ['UCO Bank', 'BOM'], ['Canara Bank', 'CAN'], ['Punjab National Bank', 'PNB'],
  ['Income Tax - CBDT format', 'CBDT'], ['Capital Gains - FMV as on 01.04.2001', 'CAPG']];
VS.PTYPES = ['Land + Building', 'Vacant Land / Plot', 'Flat / Shop / Office'];
VS.CSTATUS = ['Completed / existing', 'Under construction'];
VS.FORMATS = ['Auto', 'IOB', 'BOM', 'CAN', 'PNB', 'CBDT', 'CAPG'];
VS.FORMAT_NAMES = { IOB: 'IOB group format', BOM: 'BOM / SBI / UCO format', CAN: 'Canara format', PNB: 'PNB format', CBDT: 'Income Tax (CBDT) format', CAPG: 'Capital Gains (2001) format' };
VS.DEFAULT_RULES = { rv: 0.90, fsv: 0.80, life: 50, salv: 0.10, rnd: 1000, f1: 0.75, f2: 1.10, sbua: 1.20, carp: 0.80, cant: 0.50, ladj: 0.80, esc: 6, fsiMax: 1.1, photoKB: 150, photoPx: 1280, stamp: true, autofix: true };

VS.num = v => { if (v === null || v === undefined || v === '') return 0; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
VS.has = v => v !== null && v !== undefined && String(v).trim() !== '';
VS.mround = (x, m) => { if (!m) return x; const s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) / m + 1e-9) * m; };
VS.round = x => Math.round(x + (x >= 0 ? 1e-9 : -1e-9));

VS.format = c => {
  const fam = c.fmtOverride && c.fmtOverride !== 'Auto' ? c.fmtOverride : ((VS.BANKS.find(b => b[0] === c.bank) || [0, 'IOB'])[1]);
  const isFlat = c.ptype === 'Flat / Shop / Office';
  const tax = fam === 'CBDT' || fam === 'CAPG';
  const uc = c.cstatus === 'Under construction';
  const sheet = tax ? fam : fam + '-' + (isFlat ? 'FL' : 'LB') + (uc && (fam === 'IOB' || fam === 'BOM') ? '-UC' : '');
  const block = tax ? 'TAX' : fam + '-' + (isFlat ? 'FL' : 'LB');
  return { fam, isFlat: isFlat && !tax, tax, uc, vacant: c.ptype === 'Vacant Land / Plot', sheet, block };
};

VS.ageOf = (year, valDate) => {
  const y = VS.num(year); if (!y) return 0;
  const vy = valDate ? new Date(valDate).getFullYear() : new Date().getFullYear();
  return y > 200 ? vy - y : y;
};

VS.depFactor = age => age > 60 ? .3 : age > 50 ? .4 : age > 40 ? .5 : age > 30 ? .6 : age > 20 ? .7 : age > 10 ? .8 : age > 5 ? .9 : age > 2 ? .95 : 1;

/* effective floor areas (sqm) and rates (Rs/sqft) as the bank formats apply them */
VS.floors = (f, S) => {
  const n = VS.num, up = n(f.upper_floors), gf = n(f.gf_area);
  const area = {
    bsmt: n(f.bsmt_area), gf,
    ff: VS.has(f.ff_area) ? n(f.ff_area) : (up >= 1 ? gf : 0),
    sf: VS.has(f.sf_area) ? n(f.sf_area) : (up > 1 ? gf : 0),
    tf: VS.has(f.tf_area) ? n(f.tf_area) : (up > 2 ? gf : 0)
  };
  const r = n(f.gf_rate);
  const ff = VS.mround(r * S.f1, 100), sf = VS.mround(ff * S.f2, 100), tf = VS.mround(sf * S.f2, 100);
  const rate = { bsmt: VS.mround(r * S.f1, 100), gf: r, ff, sf, tf };
  return { area, rate };
};

VS.compute = (c, Sin) => {
  const S = Object.assign({}, VS.DEFAULT_RULES, Sin || {});
  const F = VS.format(c), f = c.f || {}, n = VS.num;
  const L = []; // calculation trace
  const add = (group, label, formula, value, unit) => L.push({ group, label, formula, value, unit: unit || '' });
  const res = { fmt: F, lines: L, S, checks: {} };
  const ext = n(f.extent);
  if (!F.isFlat) {
    const conv = (F.fam === 'CAN' || F.fam === 'PNB') ? 10.7636 : 10.76;
    const ladjFmt = F.fam === 'CAN' || F.fam === 'CBDT';
    const rate = ladjFmt ? n(f.pmr) * S.ladj : (VS.has(f.adopted) ? n(f.adopted) : n(f.pmr));
    const sqft = ext * conv;
    let land = sqft * rate;
    if (F.fam === 'PNB') land = VS.mround(land, S.rnd);
    add('Land', 'Plot area', `${fmtN(ext, 2)} sqm × ${conv}`, sqft, 'sqft');
    add('Land', ladjFmt ? `Adopted rate (${Math.round(S.ladj * 100)}% of prevailing rate, as this format applies)` : 'Adopted land rate', ladjFmt ? `${fmtN(n(f.pmr))} × ${S.ladj}` : '', rate, 'Rs/sqft');
    add('Land', 'Value of land', `${fmtN(sqft, 2)} × ${fmtN(rate, 2)}`, land, 'Rs');
    let repl = 0, dep = 0, bldg = 0, age = 0;
    const fl = VS.floors(f, S);
    if (!F.vacant) {
      const names = { bsmt: 'Basement', gf: 'Ground floor', ff: 'First floor', sf: 'Second floor', tf: 'Third floor' };
      for (const k of ['bsmt', 'gf', 'ff', 'sf', 'tf']) {
        if (F.fam === 'PNB' && k === 'tf') continue;
        const a = fl.area[k]; if (!a) continue;
        const sq = a * 10.76; const r = fl.rate[k];
        const v = F.fam === 'PNB' ? sq * r : VS.round(sq * r);
        repl += v;
        add('Building', names[k], `${fmtN(a, 2)} sqm = ${fmtN(sq, 2)} sqft × Rs ${fmtN(r)}`, v, 'Rs');
      }
      add('Building', 'Replacement cost', 'sum of floors', repl, 'Rs');
      age = F.uc ? 0 : VS.ageOf(f.year, c.valDate);
      res.age = age;
      const frac = Math.min(1, age / S.life);
      if (age > 2) dep = repl * (1 - S.salv) * frac;
      if (F.fam === 'PNB' && age > 2) dep = VS.mround(dep, S.rnd);
      add('Building', 'Depreciation', age > 2 ? `${fmtN(repl)} × ${(1 - S.salv)} × min(1, ${age}/${S.life})` : `age ${age} yrs – not depreciated`, dep, 'Rs');
      bldg = repl - dep;
      add('Building', 'Depreciated value of building', '', bldg, 'Rs');
    }
    const spec = VS.SPEC || (typeof window !== 'undefined' && window.VS_SPEC) || null;
    const rowsIn = k => { if (!spec) return true; const fd = spec.fields.find(x => x.key === k); return !!(fd && fd.rows[F.block] && fd.rows[F.block].length); };
    const restOK = spec ? rowsIn('x_rest') : true;
    let extras = 0; const unplaced = [];
    for (const k of Object.keys(f)) {
      if (!k.startsWith('x_') || k === 'x_rest' || !n(f[k])) continue;
      if (rowsIn(k) || restOK) extras += n(f[k]); else unplaced.push(k);
    }
    res.unplacedExtras = unplaced;
    if (extras) add('Extras', 'Extra items, amenities & services', 'as entered', extras, 'Rs');
    const stage = F.uc ? Math.min(1, n(f.stage) / 100) : 1;
    let total = land + bldg + extras;
    res.fmv = VS.mround(total, S.rnd);
    if (F.uc) {
      const now = F.fam === 'CAN' ? land + bldg * stage + extras : land + bldg * stage;
      res.fmvNow = VS.mround(now, S.rnd);
      add('Result', `Value as on date (work done ${Math.round(stage * 100)}%)`, F.fam === 'CAN' ? 'land + building × stage + extras' : 'land + building × stage', res.fmvNow, 'Rs');
      add('Result', 'Value after completion', 'land + building + extras', res.fmv, 'Rs');
    } else add('Result', 'Fair market value', `round(${fmtN(total)}) to ${fmtN(S.rnd)}`, res.fmv, 'Rs');
    const base = F.uc ? res.fmvNow : res.fmv;
    res.rv = VS.mround(base * S.rv, S.rnd); res.fsv = VS.mround(base * S.fsv, S.rnd);
    // guideline value
    const totA = F.vacant ? 0 : fl.area.bsmt + fl.area.gf + fl.area.ff + fl.area.sf + fl.area.tf;
    const gl = n(f.glr_land), gb = n(f.glr_bldg), fac = VS.depFactor(age);
    let gvl = ext * gl, gvb = totA * gb * (age > 2 ? fac : 1);
    if (F.fam === 'BOM') { gvl = VS.mround(gvl, S.rnd); gvb = VS.mround(gvb, S.rnd); }
    if (F.fam === 'IOB') gvl = VS.round(gvl);
    res.gv = gl ? gvl + (gb ? gvb : 0) : null;
    if (gl) add('Guideline', 'Govt. guideline value', `land ${fmtN(ext, 2)} sqm × ${fmtN(gl)}` + (gb ? ` + building ${fmtN(totA, 2)} sqm × ${fmtN(gb)} × ${fac}` : ''), res.gv, 'Rs');
    Object.assign(res, { land, landRate: rate, sqft, repl, dep, bldg, extras, stage, floors: fl, totArea: totA });
  } else {
    const bua = n(f.bua), sbua = bua * S.sbua, carpet = bua * S.carp;
    const age = F.uc ? 0 : (F.fam === 'PNB' && VS.has(f.age) ? n(f.age) : VS.ageOf(f.year, c.valDate));
    res.age = age;
    const ratio = age > 2 ? 1 - (1 - S.salv) * Math.min(1, age / S.life) : 1;
    const br = n(f.bldg_rate), cr = n(f.comp_rate);
    const depB = ratio * br, landO = cr - br, comp = depB + landO;
    add('Flat', 'Areas', `built-up ${fmtN(bua, 2)} · super built-up ${fmtN(sbua, 2)} · carpet ${fmtN(carpet, 2)}`, sbua, 'sqm');
    add('Flat', 'Depreciated building rate', `${fmtN(br)} × ${ratio.toFixed(4)} (age ${age} yrs)`, depB, 'Rs/sqft');
    add('Flat', 'Land & other component', `${fmtN(cr)} − ${fmtN(br)}`, landO, 'Rs/sqft');
    add('Flat', 'Composite rate adopted', '', comp, 'Rs/sqft');
    const basis = F.fam === 'CAN' ? Math.round(bua * 10.7636 * 100) / 100 : Math.max(bua, sbua) * 10.76;
    const ucComp = F.uc ? cr : comp;
    const value = basis * ucComp;
    add('Flat', F.fam === 'CAN' ? 'Value (built-up area basis, Canara)' : 'Value (super built-up area basis)', `${fmtN(basis, 2)} sqft × ${fmtN(ucComp, 2)}`, value, 'Rs');
    res.fmv = VS.mround(value, S.rnd);
    if (F.uc) {
      const st = Math.min(1, n(f.stage) / 100 || 0);
      res.fmvNow = VS.mround(value * st, S.rnd);
      add('Result', `Value as on date (work done ${Math.round(st * 100)}%)`, '', res.fmvNow, 'Rs');
    }
    add('Result', F.uc ? 'Value after completion' : 'Fair market value', `round to ${fmtN(S.rnd)}`, res.fmv, 'Rs');
    const base = F.uc ? res.fmvNow : res.fmv;
    res.rv = VS.mround(base * S.rv, S.rnd); res.fsv = VS.mround(base * S.fsv, S.rnd);
    const gl = n(f.glr_land), gfr = n(f.glr_flat);
    res.gv = gl && gfr ? (gl + (VS.mround(100 - age, 10) / 100) * (gfr - gl)) * Math.max(bua, sbua) : null;
    if (res.gv) add('Guideline', 'Govt. guideline value', `(${fmtN(gl)} + ${VS.mround(100 - age, 10)}% × (${fmtN(gfr)} − ${fmtN(gl)})) × ${fmtN(sbua, 2)} sqm`, res.gv, 'Rs');
    Object.assign(res, { bua, sbua, carpet, comp, depB, landO, basis });
  }
  add('Result', 'Realizable value', `${Math.round(S.rv * 100)}%`, res.rv, 'Rs');
  add('Result', 'Forced / distress sale value', `${Math.round(S.fsv * 100)}%`, res.fsv, 'Rs');
  return res;
};

function fmtN(x, d) { if (x === null || x === undefined || !isFinite(x)) return '–'; return Number(x).toLocaleString('en-IN', { maximumFractionDigits: d === undefined ? 0 : d, minimumFractionDigits: 0 }); }
VS.fmtN = fmtN;
VS.rs = x => (x === null || x === undefined || !isFinite(x)) ? '–' : '₹ ' + fmtN(Math.round(x));

VS.words = x => {
  const n0 = Math.round(VS.num(x)); if (!n0) return '';
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const w2 = k => k < 20 ? ones[k] : (tens[Math.floor(k / 10)] + ' ' + ones[k % 10]).trim();
  const cr = Math.floor(n0 / 1e7), lk = Math.floor(n0 % 1e7 / 1e5), th = Math.floor(n0 % 1e5 / 1e3), hu = Math.floor(n0 % 1e3 / 100), re = n0 % 100;
  const crw = cr >= 100 ? w2(Math.floor(cr / 100)) + ' Hundred ' + w2(cr % 100) : w2(cr);
  const t = [(cr ? crw + ' Crore' : ''), (lk ? w2(lk) + ' Lac' : ''), (th ? w2(th) + ' Thousand' : ''), (hu ? w2(hu) + ' Hundred' : ''), w2(re)].filter(Boolean).join(' ');
  return 'Rupees ' + t.replace(/\s+/g, ' ').trim() + ' Only';
};

/* ---------- comparable sale instances ---------- */
VS.comps = (c, S) => {
  const n = VS.num, vd = c.valDate ? new Date(c.valDate) : new Date();
  const rows = (c.comps || []).map((r, i) => {
    const area = r.unit === 'sqm' ? n(r.area) * 10.76 : n(r.area);
    const rate = area ? n(r.price) / area : 0;
    let months = 0;
    if (r.date) { const d = new Date(r.date); months = Math.max(0, (vd - d) / (1000 * 3600 * 24 * 30.44)); }
    const tAdj = (S.esc / 100) * months / 12;
    const adj = (1 + tAdj) * (1 + n(r.adjLoc) / 100) * (1 + n(r.adjSize) / 100) * (1 + n(r.adjOther) / 100);
    return { i, area, rate, months, tAdj, adjRate: rate * adj, valid: area > 0 && n(r.price) > 0 };
  });
  const v = rows.filter(r => r.valid).map(r => r.adjRate);
  const out = { rows, n: v.length };
  if (!v.length) return out;
  const sorted = [...v].sort((a, b) => a - b);
  const med = sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
  const mad = (() => { const d = v.map(x => Math.abs(x - med)).sort((a, b) => a - b); return d.length % 2 ? d[(d.length - 1) / 2] : (d[d.length / 2 - 1] + d[d.length / 2]) / 2; })();
  rows.forEach(r => { r.outlier = r.valid && v.length >= 4 && mad > 0 && Math.abs(r.adjRate - med) / (1.4826 * mad) > 2.5; });
  const kept = rows.filter(r => r.valid && !r.outlier).map(r => r.adjRate);
  const mean = kept.reduce((a, b) => a + b, 0) / kept.length;
  const sd = kept.length > 1 ? Math.sqrt(kept.reduce((a, b) => a + (b - mean) ** 2, 0) / (kept.length - 1)) : 0;
  Object.assign(out, { median: med, mean, sd, cv: mean ? sd / mean : 0, min: Math.min(...kept), max: Math.max(...kept), kept: kept.length, suggested: Math.round(mean / 10) * 10 });
  return out;
};

/* ---------- quality checks ---------- */
VS.checks = (c, r, S) => {
  const f = c.f || {}, n = VS.num, F = r.fmt, out = [];
  const E = (id, msg, tab) => out.push({ sev: 'error', id, msg, tab });
  const W = (id, msg, tab) => out.push({ sev: 'warn', id, msg, tab });
  const I = (id, msg, tab) => out.push({ sev: 'info', id, msg, tab });
  const today = new Date(); today.setHours(23, 59, 59);
  if (!VS.has(f.owner)) E('owner', 'Owner name is missing.', 'property');
  if (!VS.has(c.bank)) E('bank', 'Choose the bank or purpose of valuation.', 'assignment');
  if (!VS.has(f.inspect_date)) W('insp', 'Date of inspection is not entered.', 'assignment');
  else if (new Date(f.inspect_date) > today) E('insp2', 'Date of inspection is in the future.', 'assignment');
  if (c.valDate && f.inspect_date && new Date(c.valDate) < new Date(f.inspect_date)) W('vd', 'Date of valuation is before the date of inspection.', 'assignment');
  const bnd = ['bN', 'bS', 'bE', 'bW'].filter(k => !VS.has(f[k]));
  if (bnd.length) W('bnd', `Boundaries missing: ${bnd.map(k => ({ bN: 'North', bS: 'South', bE: 'East', bW: 'West' })[k]).join(', ')}.`, 'property');
  if (!VS.has(f.locality) || !VS.has(f.town)) W('addr', 'Locality or town is missing from the address.', 'property');
  if (!F.isFlat) {
    if (!n(f.extent)) E('ext', 'Plot area is missing.', 'land');
    const rate = r.landRate;
    if (!rate) E('rate', 'Land rate is missing (prevailing / adopted rate).', 'land');
    if (VS.has(f.adopted) && n(f.pmr) && n(f.adopted) > n(f.pmr) * 1.001) W('adopt', 'Adopted land rate is higher than the prevailing market rate.', 'land');
    if ((F.fam === 'CAN' || F.fam === 'CBDT') && VS.has(f.adopted) && Math.abs(n(f.adopted) - n(f.pmr) * S.ladj) > 1) I('ladj', `${VS.FORMAT_NAMES[F.fam]} adopts ${Math.round(S.ladj * 100)}% of the prevailing rate (Rs ${fmtN(n(f.pmr) * S.ladj)}/sqft), not your adopted rate of Rs ${fmtN(n(f.adopted))}.`, 'land');
    if (n(f.dimN) && n(f.dimE) && n(f.extent)) {
      const a = n(f.dimN) * n(f.dimE), d = Math.abs(a - n(f.extent)) / n(f.extent);
      if (d > 0.05) W('dim', `Dimensions give ${fmtN(a, 2)} sqm but plot area is ${fmtN(n(f.extent), 2)} sqm (${(d * 100).toFixed(1)}% apart).`, 'land');
    }
    if (!F.vacant) {
      if (!n(f.gf_area)) E('gfa', 'Ground floor area is missing.', 'building');
      if (!n(f.gf_rate)) E('gfr', 'Construction rate for the ground floor is missing.', 'building');
      if (!F.uc && !VS.has(f.year)) E('yr', 'Year of construction is missing.', 'building');
      if (VS.has(f.year) && (n(f.year) > today.getFullYear() || (n(f.year) > 200 && n(f.year) < 1900))) E('yr2', 'Year of construction looks wrong.', 'building');
      if (n(f.extent) && n(f.gf_area) > n(f.extent)) E('cov', `Ground floor (${fmtN(n(f.gf_area), 2)} sqm) is larger than the plot (${fmtN(n(f.extent), 2)} sqm).`, 'building');
      if (n(f.extent) && r.totArea / n(f.extent) > S.fsiMax) W('fsi', `Built-up area uses FSI ${(r.totArea / n(f.extent)).toFixed(2)}, above ${S.fsiMax}. Check the sanctioned plan.`, 'building');
      if (r.age >= S.life) W('life', `Building is ${r.age} years old, at or beyond the ${S.life}-year life; it is held at salvage value.`, 'building');
      if (!VS.has(f.permission)) W('perm', 'Building permission / plan sanction details are not entered.', 'building');
      if (F.uc && !n(f.stage)) W('stage', 'Under construction: enter the % of work completed.', 'building');
    }
  } else {
    if (!n(f.bua)) E('bua', 'Built-up area of the flat is missing.', 'flat');
    if (!n(f.comp_rate)) E('cr', 'Composite rate is missing.', 'flat');
    if (n(f.comp_rate) && n(f.bldg_rate) >= n(f.comp_rate)) E('cr2', 'Building component rate must be less than the composite rate.', 'flat');
    if (!F.uc && !VS.has(f.year) && !(F.fam === 'PNB' && VS.has(f.age))) E('fyr', 'Year of construction of the building is missing.', 'flat');
    if (r.age >= S.life) W('life', `Building is ${r.age} years old, at or beyond the ${S.life}-year life.`, 'flat');
  }
  if (r.gv === null) W('gv', 'Guideline (ready reckoner) rates are not entered, so guideline value is not worked out.', F.isFlat ? 'flat' : 'land');
  else if (r.fmv) {
    const base = F.uc ? r.fmvNow : r.fmv;
    if (base < r.gv) W('gvlow', `Market value (${VS.rs(base)}) is below the guideline value (${VS.rs(r.gv)}). Banks usually ask for a justification.`, 'valuation');
    if (base > r.gv * 2.5) W('gvhigh', `Market value is ${(base / r.gv).toFixed(1)} × the guideline value. Record the reason.`, 'valuation');
  }
  const cs = VS.comps(c, S);
  if (cs.n < 2) W('comps', 'Fewer than two sale instances recorded. Bank formats ask for at least two.', 'comps');
  else {
    if (cs.cv > 0.15) W('cv', `Sale instances vary widely (spread ${(cs.cv * 100).toFixed(0)}%). Check the adjustments.`, 'comps');
    const ref = F.isFlat ? n(f.comp_rate) : (VS.has(f.adopted) ? n(f.adopted) : n(f.pmr));
    if (ref && cs.suggested && Math.abs(ref - cs.suggested) / cs.suggested > 0.2) W('cmpdev', `Your rate (Rs ${fmtN(ref)}) is ${((ref / cs.suggested - 1) * 100).toFixed(0)}% from the sale-instance rate (Rs ${fmtN(cs.suggested)}).`, 'comps');
    if (cs.rows.some(x => x.outlier)) I('outl', 'One or more sale instances were left out as outliers.', 'comps');
  }
  const ph = c.photos || [];
  if (ph.length < 4) W('ph', `${ph.length} photo(s) attached. Most banks expect at least four, including one with the owner/representative.`, 'photos');
  if (!(n(c.lat) && n(c.lon))) W('geo', 'Latitude / longitude of the property is not recorded.', 'property');
  if (r.unplacedExtras && r.unplacedExtras.length) I('xpl', `${r.unplacedExtras.length} extra item(s) have no place in the ${F.sheet} format and are left out of its value.`, 'building');
  if (F.fam === 'CAPG') I('capg', 'Capital Gains needs rates as on 01.04.2001. Finish the valuation in the Excel workbook.', 'valuation');
  return out;
};

if (typeof module !== 'undefined') module.exports = VS;

<script>/* ===== Valuation Studio – files: Excel hand-off, zip, EXIF, photo processing ===== */
VS.esc = s => String(s).replace(/\\/g, '\\\\').replace(/\t/g, '\\t').replace(/\r?\n/g, '\\n');

VS.exportValues = (c, r, spec) => {
  const f = Object.assign({}, c.f || {}), F = r.fmt, S = r.S;
  if (!F.isFlat && !F.vacant) {
    const fl = r.floors;
    f.ff_area = fl.area.ff || ''; f.sf_area = fl.area.sf || ''; f.tf_area = fl.area.tf || ''; f.bsmt_area = fl.area.bsmt || '';
    f.bsmt_rate = fl.area.bsmt ? fl.rate.bsmt : ''; f.ff_rate = fl.area.ff ? fl.rate.ff : ''; f.sf_rate = fl.area.sf ? fl.rate.sf : '';
    if (VS.has(f.year) && !F.uc) f.year_commence = VS.num(f.year) - 1;
  }
  if (F.uc) { delete f.year; delete f.year_commence; }
  if (F.isFlat && F.fam === 'PNB') f.age = r.age;
  if (F.vacant) { f.tech = 'vacant plot; hence not applicable'; ['gf_area', 'gf_rate', 'upper_floors', 'year'].forEach(k => delete f[k]); }
  else if (F.uc) f.tech = 'under construction';
  if (VS.has(f.stage)) f.stage = VS.num(f.stage) / 100;
  if (!VS.has(f.adopted) && VS.has(f.pmr)) f.adopted = f.pmr;
  if (spec) {
    const rowsIn = k => { const fd = spec.fields.find(x => x.key === k); return !!(fd && fd.rows[F.block] && fd.rows[F.block].length); };
    if (rowsIn('x_rest')) { let rest = 0; for (const k of Object.keys(f)) if (k.startsWith('x_') && k !== 'x_rest' && !rowsIn(k)) rest += VS.num(f[k]); if (rest) f.x_rest = rest; }
  }
  return f;
};

VS.excelFile = (c, r, spec) => {
  const F = r.fmt, vals = VS.exportValues(c, r, spec);
  const L = ['#VALUATION-STUDIO\t1', `CASE\t${VS.esc(c.ref || c.id)}`,
    `SEL\tC4\t${VS.esc(c.bank)}`, `SEL\tC5\t${VS.esc(c.ptype)}`, `SEL\tC6\t${VS.esc(c.cstatus)}`, `SEL\tC7\t${VS.esc(c.fmtOverride || 'Auto')}`];
  const used = [], missing = [];
  for (const fd of spec.fields) {
    const rows = fd.rows[F.block];
    const v = vals[fd.key];
    if (!VS.has(v)) continue;
    if (!rows || !rows.length) { if (fd.type !== 'derived') missing.push(fd.label); continue; }
    const t = ['num', 'amt', 'pct', 'derived'].includes(fd.type) && fd.key !== 'tech' ? 'n' : fd.type === 'date' ? 'd' : 't';
    for (const row of rows) L.push(`ROW\t${row}\t${t}\t${VS.esc(v)}`);
    if (fd.type !== 'derived') used.push(fd.label);
  }
  const cells = (spec.report_cells || {})[F.sheet] || {};
  const map = { fmv: r.fmv, fmv_now: r.fmvNow, rv: r.rv, fsv: r.fsv, gv: r.gv };
  const names = { fmv: F.uc ? 'Value after completion' : 'Fair market value', fmv_now: 'Value as on date', rv: 'Realizable value', fsv: 'Forced sale value', gv: 'Guideline value' };
  for (const k in cells) if (map[k] !== null && map[k] !== undefined && isFinite(map[k])) L.push(`CHECK\t${F.sheet}!${cells[k]}\t${Math.round(map[k])}\t${names[k]}`);
  return { text: L.join('\r\n') + '\r\n', used, missing, sheet: F.sheet };
};

/* ---- zip (store, no compression; JPEGs are already compressed) ---- */
VS.crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
VS.crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = VS.crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
VS.zip = files => { // files: [{name, data:Uint8Array}]
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), crc = VS.crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true);
    h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true);
    c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + sz;
  }
  const csz = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csz, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' });
};

/* ---- EXIF: date taken + GPS ---- */
VS.exif = buf => {
  const d = new DataView(buf), out = {};
  try {
    if (d.getUint16(0) !== 0xFFD8) return out;
    let p = 2;
    while (p < d.byteLength - 4) {
      const mk = d.getUint16(p), len = d.getUint16(p + 2);
      if (mk === 0xFFE1 && d.getUint32(p + 4) === 0x45786966) {
        const t = p + 10, le = d.getUint16(t) === 0x4949;
        const u16 = o => d.getUint16(t + o, le), u32 = o => d.getUint32(t + o, le);
        const rat = o => u32(o) / (u32(o + 4) || 1);
        const ifd = (o, cb) => { const n = u16(o); for (let i = 0; i < n; i++) { const e = o + 2 + i * 12; cb(u16(e), u16(e + 2), u32(e + 4), e + 8); } };
        const str = (o, n) => { let s = ''; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(d.getUint8(t + o + i)); return s; };
        let gps = 0, sub = 0;
        ifd(u32(4), (tag, type, cnt, vo) => { if (tag === 0x8825) gps = u32(vo); if (tag === 0x8769) sub = u32(vo); if (tag === 0x0112) out.orientation = u16(vo); });
        if (sub) ifd(sub, (tag, type, cnt, vo) => { if (tag === 0x9003) out.taken = str(u32(vo), cnt); });
        if (gps) {
          const g = {};
          ifd(gps, (tag, type, cnt, vo) => {
            if (tag === 1 || tag === 3) g[tag] = String.fromCharCode(d.getUint8(t + vo)); // ASCII ref stored inline
            if (tag === 2 || tag === 4) { const o = u32(vo); g[tag] = rat(o) + rat(o + 8) / 60 + rat(o + 16) / 3600; }
          });
          if (g[2] && g[4]) { out.lat = g[2] * (g[1] === 'S' ? -1 : 1); out.lon = g[4] * (g[3] === 'W' ? -1 : 1); }
        }
        break;
      }
      if ((mk & 0xFF00) !== 0xFF00) break;
      p += 2 + len;
    }
  } catch (e) { }
  return out;
};

/* ---- photo processing: auto levels + resize + stamp + compress to target KB ---- */
VS.loadImage = blob => new Promise((ok, bad) => {
  const u = URL.createObjectURL(blob), im = new Image();
  im.onload = () => { ok(im); setTimeout(() => URL.revokeObjectURL(u), 1000); };
  im.onerror = () => { URL.revokeObjectURL(u); bad(new Error('This file could not be read as a picture. Use JPG or PNG.')); };
  im.src = u;
});

VS.autoLevels = (ctx, w, h) => {
  const img = ctx.getImageData(0, 0, w, h), a = img.data, hist = new Uint32Array(256);
  const step = Math.max(1, Math.floor((w * h) / 120000)) * 4; let n = 0, sum = 0;
  for (let i = 0; i < a.length; i += step) { const l = (a[i] * 77 + a[i + 1] * 150 + a[i + 2] * 29) >> 8; hist[l]++; sum += l; n++; }
  let acc = 0, lo = 0, hi = 255;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= n * 0.005) { lo = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= n * 0.005) { hi = i; break; } }
  if (hi - lo < 16) return { applied: false };
  let sc = 255 / (hi - lo); if (sc > 1.8) { const mid = (lo + hi) / 2; sc = 1.8; lo = mid - 127.5 / sc; }
  const mean = sum / n; let m2 = Math.min(.95, Math.max(.05, (mean - lo) * sc / 255));
  let gm = Math.log(0.48) / Math.log(m2); gm = Math.min(1.4, Math.max(0.7, gm));
  const lut = new Uint8ClampedArray(256);
  for (let i = 0; i < 256; i++) { let v = Math.min(1, Math.max(0, (i - lo) * sc / 255)); lut[i] = Math.round(255 * Math.pow(v, gm)); }
  for (let i = 0; i < a.length; i += 4) { a[i] = lut[a[i]]; a[i + 1] = lut[a[i + 1]]; a[i + 2] = lut[a[i + 2]]; }
  ctx.putImageData(img, 0, 0);
  return { applied: true, lo: Math.round(lo), hi, gamma: +gm.toFixed(2) };
};

VS.toBlob = (cv, q) => new Promise(ok => cv.toBlob(ok, 'image/jpeg', q));

VS.processPhoto = async (file, opt) => {
  const buf = await file.arrayBuffer();
  const ex = VS.exif(buf);
  const im = await VS.loadImage(new Blob([buf], { type: file.type || 'image/jpeg' }));
  let w = im.naturalWidth, h = im.naturalHeight;
  let k = Math.min(1, opt.maxPx / Math.max(w, h));
  const draw = (scale) => {
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    let src = im, sw = w, sh = h;
    // step down for quality
    while (sw / 2 > cw) {
      const t = document.createElement('canvas'); t.width = Math.round(sw / 2); t.height = Math.round(sh / 2);
      t.getContext('2d').drawImage(src, 0, 0, t.width, t.height); src = t; sw = t.width; sh = t.height;
    }
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(src, 0, 0, cw, ch);
    let lv = { applied: false };
    if (opt.autofix) lv = VS.autoLevels(ctx, cw, ch);
    if (opt.stamp) {
      const lat = ex.lat ?? opt.lat, lon = ex.lon ?? opt.lon;
      const when = ex.taken ? ex.taken.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$3-$2-$1') : new Date().toLocaleString('en-IN');
      const txt = [opt.ref, when, (lat && lon) ? `${(+lat).toFixed(6)}° N, ${(+lon).toFixed(6)}° E` : ''].filter(Boolean).join('  ·  ');
      const fs = Math.max(11, Math.round(cw / 70));
      ctx.font = `600 ${fs}px "IBM Plex Sans", Arial, sans-serif`;
      const bh = Math.round(fs * 1.9);
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, ch - bh, cw, bh);
      ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(txt, Math.round(fs * .8), ch - bh / 2);
    }
    return { cv, lv };
  };
  let { cv, lv } = draw(k), blob = null, q = 0.9;
  for (let attempt = 0; attempt < 6; attempt++) {
    let lo = 0.35, hi = 0.92; blob = await VS.toBlob(cv, hi);
    if (blob.size > opt.targetKB * 1024) {
      for (let i = 0; i < 7; i++) { q = (lo + hi) / 2; const b = await VS.toBlob(cv, q); if (b.size > opt.targetKB * 1024) hi = q; else { lo = q; blob = b; } }
      if (blob.size > opt.targetKB * 1024) { blob = await VS.toBlob(cv, 0.35); }
    } else q = hi;
    if (blob.size <= opt.targetKB * 1024) break;
    k *= 0.82; ({ cv, lv } = draw(k));
  }
  return { blob, w: cv.width, h: cv.height, kb: Math.round(blob.size / 1024), q: +q.toFixed(2), exif: ex, levels: lv, origKB: Math.round(file.size / 1024), origW: w, origH: h };
};

VS.blobToDataURL = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
</script>

  const open = ch.filter(x => x.sev !== 'info');
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${h(c.ref)} – Valuation summary – ${h(f.owner || '')}</title>

<script>/* ===== Valuation Studio – storage + interface ===== */
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const SPEC = window.VS_SPEC;
  const FIELD = Object.fromEntries(SPEC.fields.map(f => [f.key, f]));
  const localISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const todayISO = () => localISO(new Date());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---------------- storage ---------------- */
  const Store = {
    mode: 'local', db: null, user: null, assets: null, downloads: null, sample: null, uid: null,
    async init() {
      const C = window.claude;
      if (C && C.use) {
        try {
          const [db, user, assets, downloads, sample] = await Promise.all(['db', 'user', 'assets', 'downloads', 'sample'].map(n => C.use(n).catch(() => null)));
          Object.assign(this, { assets, downloads, sample, user });
          if (db && user) { const id = await user.id(); if (id) { this.db = db; this.uid = id; this.mode = 'cloud'; } }
        } catch (e) { }
      }
      if (this.mode !== 'cloud') await this.localInit();
    },
    col() { return this.db.collection('data/users/' + this.uid + '/cases'); },
    /* on-device storage: IndexedDB (cases, settings, photos) */
    idb() {
      if (this._idb) return this._idb;
      return (this._idb = new Promise((ok, bad) => {
        const r = indexedDB.open('vs-photos', 2);
        r.onupgradeneeded = () => { const d = r.result; for (const n of ['p', 'cases', 'meta']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
        r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error);
      }));
    },
    async tx(store, mode, fn) {
      const d = await this.idb();
      return new Promise((ok, bad) => { const t = d.transaction(store, mode); const os = t.objectStore(store); let out; const q = fn(os); if (q) q.onsuccess = () => { out = q.result; }; t.oncomplete = () => ok(out); t.onerror = () => bad(t.error || new Error('Saving on this device failed.')); t.onabort = () => bad(t.error || new Error('This device has no room left to save.')); });
    },
    async localInit() {
      try { if (navigator.storage && navigator.storage.persist) this.persisted = await navigator.storage.persist(); } catch (e) { }
      // one-time move of cases saved by older versions in localStorage
      try {
        const old = JSON.parse(localStorage.getItem('vs.cases') || 'null');
        if (old && old.length) { for (const c of old) await this.tx('cases', 'readwrite', os => os.put(c, c.id)); localStorage.removeItem('vs.cases'); }
        const os = JSON.parse(localStorage.getItem('vs.settings') || 'null');
        if (os) { await this.tx('meta', 'readwrite', o => o.put(os, 'settings')); localStorage.removeItem('vs.settings'); }
      } catch (e) { }
    },
    async list() {
      if (this.mode === 'cloud') { const s = await this.col().get(); return s.docs.map(d => d.data()); }
      return (await this.tx('cases', 'readonly', os => os.getAll())) || [];
    },
    async put(c) {
      c.updated = new Date().toISOString();
      const clean = JSON.parse(JSON.stringify(c));
      if (this.mode === 'cloud') return this.col().doc(c.id).set(clean);
      return this.tx('cases', 'readwrite', os => os.put(clean, clean.id));
    },
    async del(id) {
      if (this.mode === 'cloud') return this.col().doc(id).delete();
      return this.tx('cases', 'readwrite', os => os.delete(id));
    },
    async getSettings() {
      if (this.mode === 'cloud') { const s = await this.db.doc('data/users/' + this.uid + '/meta/settings').get(); return s.exists ? s.data() : null; }
      return (await this.tx('meta', 'readonly', os => os.get('settings'))) || null;
    },
    async putSettings(s) {
      if (this.mode === 'cloud') return this.db.doc('data/users/' + this.uid + '/meta/settings').set(JSON.parse(JSON.stringify(s)));
      return this.tx('meta', 'readwrite', os => os.put(JSON.parse(JSON.stringify(s)), 'settings'));
    },
    async savePhoto(blob) {
      if (this.assets) { const a = await this.assets.upload(blob); return { store: 'asset', aid: a.id, url: a.url }; }
      const id = 'p' + uid();
      await this.tx('p', 'readwrite', os => os.put(blob, id));
      return { store: 'idb', aid: id };
    },
    async photoBlob(p) {
      if (p.store === 'asset') { const r = await fetch(p.url || ('/_blob/' + p.aid)); return r.blob(); }
      return this.tx('p', 'readonly', os => os.get(p.aid));
    },
    async photoURL(p) {
      if (p.store === 'asset') return p.url || ('/_blob/' + p.aid);
      if (!this._urls) this._urls = {};
      if (this._urls[p.aid]) return this._urls[p.aid];
      try { const b = await this.photoBlob(p); return (this._urls[p.aid] = b ? URL.createObjectURL(b) : ''); } catch (e) { return ''; }
    },
    async deletePhoto(p) {
      try { if (p.store === 'asset' && this.assets) await this.assets.delete(p.aid); else if (p.store === 'idb') await this.tx('p', 'readwrite', os => os.delete(p.aid)); } catch (e) { }
    },
    async save(filename, data) {
      if (this.downloads) { try { await this.downloads.save({ filename, data }); return 'saved'; } catch (e) { if (e && e.code === 'declined') return 'declined'; throw new Error(e && e.message || 'Saving was not possible here.'); } }
      // plain browser (file opened directly): normal download
      const b = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000); return 'saved';
    }
  };
  VS.Store = Store;

  /* ---------------- state ---------------- */
  const st = { cases: [], settings: null, view: 'register', caseId: null, tab: 'assignment', filter: 'all', q: '', saving: '', confirm: null, busy: '' };
  VS.state = st;
  const rules = () => Object.assign({}, VS.DEFAULT_RULES, (st.settings && st.settings.rules) || {});
  const cur = () => st.cases.find(c => c.id === st.caseId);

  function newCase(extra) {
    const last = st.cases.slice().sort((a, b) => (b.updated || '').localeCompare(a.updated || ''))[0];
    const yr = new Date().getFullYear(), seq = st.cases.filter(c => (c.ref || '').startsWith('V/' + yr)).length + 1;
    return Object.assign({
      id: uid(), created: new Date().toISOString(), status: 'Assigned', ref: `V/${yr}/${String(seq).padStart(3, '0')}`,
      bank: last ? last.bank : 'Indian Overseas Bank', ptype: 'Land + Building', cstatus: 'Completed / existing', fmtOverride: 'Auto',
      branch: '', assigned: todayISO(), due: '', valDate: todayISO(), fee: '', feeReceived: '', billNo: '',
      f: { purpose: 'to find the value of property offered as security to the bank.', inspect_date: todayISO(), bldg_rate: 1600 },
      comps: [], photos: [], remarks: '', lat: '', lon: ''
    }, extra || {});
  }

  function exampleCase() {
    return newCase({

  /* ---------------- persistence ---------------- */
  let saveT = null, pending = null;
  function flush() { if (pending) { clearTimeout(saveT); const c = pending; pending = null; Store.put(c).catch(() => { }); } }
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  function touch(c) {
    st.saving = 'Saving…'; paintStatus(); pending = c;
    clearTimeout(saveT);
    saveT = setTimeout(async () => { pending = null;
      try { await Store.put(c); st.saving = Store.mode === 'cloud' ? 'Saved' : 'Saved on this device'; }
      catch (e) { st.saving = 'Not saved: ' + e.message; }
      paintStatus();
    }, 600);
  }
  function paintStatus() { const el = $('#savestate'); if (el) { el.textContent = st.saving; el.dataset.bad = /Not saved/.test(st.saving) ? '1' : ''; } }

  /* ---------------- helpers ---------------- */
  const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const set = (o, path, v) => { const ks = path.split('.'); let a = o; for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[ks[i]]; } a[ks[ks.length - 1]] = v; };
  const chip = (txt, cls) => `<span class="chip ${cls || ''}">${h(txt)}</span>`;
  const STATUSES = ['Assigned', 'Inspected', 'Valued', 'Delivered', 'Cancelled'];
  const statusCls = s => ({ Assigned: 'c-blue', Inspected: 'c-amber', Valued: 'c-teal', Delivered: 'c-green', Cancelled: 'c-grey' })[s] || '';

  function input(path, label, type, opts) {
    const c = cur(); const v = get(c, path); const id = 'i_' + path.replace(/\W/g, '_');
    opts = opts || {};
    let ctl;
    if (type === 'select') ctl = `<select id="${id}" data-k="${path}">${(opts.options || []).map(o => `<option ${String(o) === String(v ?? '') ? 'selected' : ''} value="${h(o)}">${h(o === '' ? '—' : o)}</option>`).join('')}</select>`;
    else if (type === 'list') ctl = `<input id="${id}" data-k="${path}" list="${id}_l" value="${h(v ?? '')}" autocomplete="off"><datalist id="${id}_l">${(opts.options || []).map(o => `<option value="${h(o)}">`).join('')}</datalist>`;
    else if (type === 'area') ctl = `<textarea id="${id}" data-k="${path}" rows="${opts.rows || 3}">${h(v ?? '')}</textarea>`;
    else ctl = `<input id="${id}" data-k="${path}" type="${type === 'num' ? 'text' : type}" ${type === 'num' ? 'inputmode="decimal" data-num="1"' : ''} value="${h(v ?? '')}" ${opts.ph ? `placeholder="${h(opts.ph)}"` : ''}>`;
    return `<label class="fld ${opts.wide ? 'wide' : ''}" for="${id}"><span>${h(label)}${opts.unit ? ` <em>${h(opts.unit)}</em>` : ''}</span>${ctl}${opts.hint ? `<small>${opts.hint}</small>` : ''}</label>`;
  }
  function specField(key, extra) {
    const f = FIELD[key]; if (!f) return '';
    const p = 'f.' + key;
    const unitM = (f.label.match(/\(([^)]*)\)\s*$/) || [])[1];
    const label = unitM ? f.label.replace(/\s*\([^)]*\)\s*$/, '') : f.label;
    if (f.type === 'select') return input(p, label, 'list', Object.assign({ options: f.options || [] }, extra));
    if (f.type === 'district') return input(p, label, 'list', Object.assign({ options: Object.keys(SPEC.districts) }, extra));
    if (f.type === 'date') return input(p, label, 'date', extra);
    if (['num', 'amt', 'pct'].includes(f.type)) return input(p, label, 'num', Object.assign({ unit: unitM || (f.type === 'amt' ? 'Rs' : '') }, extra));
    return input(p, label, 'text', Object.assign({ unit: unitM }, extra));
  }
  const group = (title, body, note) => `<section class="grp"><h3>${h(title)}</h3>${note ? `<p class="note">${note}</p>` : ''}<div class="grid">${body}</div></section>`;

  /* ---------------- views ---------------- */
  function render() {
    const root = $('#view'); if (!root) return;
    document.body.dataset.view = st.view;
    $('#nav').innerHTML = [['register', 'Register'], ['case', 'Case'], ['settings', 'Settings']].map(([k, t]) =>
      `<button class="nav ${st.view === k ? 'on' : ''}" data-nav="${k}" ${k === 'case' && !cur() ? 'disabled' : ''}>${t}</button>`).join('');
    if (st.view === 'register') root.innerHTML = viewRegister();
    else if (st.view === 'settings') root.innerHTML = viewSettings();
    else if (cur()) root.innerHTML = viewCase();
    else { st.view = 'register'; root.innerHTML = viewRegister(); }
    paintLive(); paintStatus();
    if (st.view === 'case' && st.tab === 'photos') paintPhotos();
    const on = document.querySelector('.tab.on'); if (on && on.scrollIntoView) { try { on.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) { } }
  }

  function viewRegister() {
    const S = rules();
    const rows = st.cases.slice().sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
    const q = st.q.toLowerCase();
    const vis = rows.filter(c => (st.filter === 'all' || (st.filter === 'open' ? !['Delivered', 'Cancelled'].includes(c.status) : c.status === st.filter)) &&
      (!q || [c.ref, c.f && c.f.owner, c.bank, c.branch, c.f && c.f.locality].join(' ').toLowerCase().includes(q)));
    const now = new Date(), ym = todayISO().slice(0, 7);
    const open = rows.filter(c => !['Delivered', 'Cancelled'].includes(c.status));
    const overdue = open.filter(c => c.due && c.due < todayISO());
    const delivM = rows.filter(c => c.status === 'Delivered' && (c.delivered || c.updated || '').startsWith(ym));
    const billed = rows.filter(c => c.status !== 'Cancelled').reduce((s, c) => s + VS.num(c.fee), 0);
    const recd = rows.reduce((s, c) => s + VS.num(c.feeReceived), 0);
    const tat = rows.filter(c => c.status === 'Delivered' && c.delivered && c.assigned).map(c => (new Date(c.delivered) - new Date(c.assigned)) / 864e5);
    const months = []; for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(localISO(d).slice(0, 7)); }
    const perM = months.map(m => rows.filter(c => (c.assigned || c.created || '').startsWith(m)).length);
    const mx = Math.max(1, ...perM);
    const spark = `<svg viewBox="0 0 180 56" class="spark" role="img" aria-label="Cases assigned per month">${perM.map((v, i) => `<rect x="${i * 30 + 4}" y="${44 - v / mx * 36}" width="20" height="${Math.max(1, v / mx * 36)}" rx="2"></rect><text x="${i * 30 + 14}" y="54">${new Date(months[i] + '-01T12:00').toLocaleString('en-IN', { month: 'short' })}</text><text x="${i * 30 + 14}" y="${40 - v / mx * 36}" class="v">${v || ''}</text>`).join('')}</svg>`;
    const list = vis.length ? vis.map(c => {
      const r = VS.compute(c, S); const ch = VS.checks(c, r, S); const er = ch.filter(x => x.sev === 'error').length;
      const late = c.due && c.due < todayISO() && !['Delivered', 'Cancelled'].includes(c.status);
      return `<button class="case-row" data-open="${c.id}">
        <span class="cr-ref">${h(c.ref)}${c.example ? ' ' + chip('example', 'c-grey') : ''}</span>
        <span class="cr-main"><b>${h((c.f && c.f.owner) || 'Owner not entered')}</b><small>${h([c.f && c.f.locality, c.f && c.f.town].filter(Boolean).join(', ') || c.ptype)}</small></span>
        <span class="cr-bank">${h(c.bank)}<small>${h(r.fmt.sheet)}</small></span>
        <span class="cr-val">${r.fmv ? VS.rs(r.fmt.uc ? r.fmvNow : r.fmv) : '–'}</span>
        <span class="cr-st">${chip(c.status, statusCls(c.status))}${er ? chip(er + ' to fix', 'c-red') : ''}${late ? chip('overdue', 'c-red') : ''}</span>
      </button>`;
    }).join('') : `<div class="empty"><b>${st.cases.length ? 'No cases match this filter.' : 'No cases yet.'}</b><p>${st.cases.length ? 'Clear the search or pick another filter.' : 'Start with New case. Everything you enter is saved as you type.'}</p></div>`;
    return `<div class="reg">
      <div class="reg-head"><div><h1>Case register</h1><p class="sub">${Store.mode === 'cloud' ? 'Saved to your Claude account – available on phone and computer.' : 'Saved in this browser only.'}</p></div>
        <div class="head-acts"><label class="btn" for="casefile_in">Open case file</label><input id="casefile_in" type="file" accept=".json,application/json" hidden><button class="btn primary" data-act="new">New case</button></div></div>
      ${st.outmsg && st.view === 'register' ? `<p class="busy">${h(st.outmsg)}</p>` : ''}
      <div class="kpis">
        <div class="kpi"><span>Open cases</span><b>${open.length}</b><small>${overdue.length ? overdue.length + ' overdue' : 'none overdue'}</small></div>
        <div class="kpi"><span>Delivered this month</span><b>${delivM.length}</b><small>${tat.length ? 'avg ' + (tat.reduce((a, b) => a + b, 0) / tat.length).toFixed(1) + ' days to deliver' : 'turnaround shows after delivery'}</small></div>
        <div class="kpi"><span>Fees outstanding</span><b>${VS.rs(billed - recd)}</b><small>${VS.rs(recd)} received of ${VS.rs(billed)}</small></div>
        <div class="kpi chart"><span>Cases per month</span>${spark}</div>
      </div>
      <div class="filters"><input id="q" type="search" placeholder="Search owner, ref, bank, locality" value="${h(st.q)}">
        ${['all', 'open', ...STATUSES].map(s => `<button class="fchip ${st.filter === s ? 'on' : ''}" data-filter="${s}">${s === 'all' ? 'All' : s === 'open' ? 'Open' : s}</button>`).join('')}</div>
      <div class="case-list">${list}</div></div>`;
  }

  const TABS = [['assignment', 'Assignment'], ['property', 'Property'], ['land', 'Land & rates'], ['building', 'Building'], ['flat', 'Flat'], ['comps', 'Sale instances'], ['photos', 'Photos'], ['valuation', 'Valuation'], ['checks', 'Checks'], ['output', 'Output']];
  function tabsFor(F) { return TABS.filter(([k]) => !(k === 'building' && (F.isFlat || F.vacant)) && !(k === 'flat' && !F.isFlat)); }

  function viewCase() {
    const c = cur(), S = rules(), r = VS.compute(c, S), F = r.fmt, ch = VS.checks(c, r, S);
    const tabs = tabsFor(F); if (!tabs.find(t => t[0] === st.tab)) st.tab = 'assignment';
    const nErr = ch.filter(x => x.sev === 'error').length, nW = ch.filter(x => x.sev === 'warn').length;
    const body = ({ assignment: tabAssignment, property: tabProperty, land: tabLand, building: tabBuilding, flat: tabFlat, comps: tabComps, photos: tabPhotos, valuation: tabValuation, checks: tabChecks, output: tabOutput })[st.tab](c, r, S, ch);
    return `<div class="case">
      <div class="case-head"><div><p class="eyebrow">${h(c.ref)} · ${h(VS.FORMAT_NAMES[F.fam] || F.fam)} · report sheet <b>${h(F.sheet)}</b></p>
        <h1>${h((c.f && c.f.owner) || 'New case')}</h1></div>
        <div class="head-acts"><select id="st_status" data-k="status" aria-label="Case status">${STATUSES.map(s => `<option ${s === c.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <button class="btn" data-act="xfer" title="One file with this case and its photos, to open on your phone or computer">Send to other device</button><button class="btn" data-act="dup">Duplicate</button><button class="btn danger-ghost" data-act="del">Delete</button></div></div>
      ${st.confirm === 'del' ? `<div class="confirm">Delete ${h(c.ref)} and its photos? This cannot be undone. <button class="btn danger" data-act="del-yes">Delete case</button><button class="btn" data-act="del-no">Keep</button></div>` : ''}
      <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" class="tab ${st.tab === k ? 'on' : ''}" data-tab="${k}">${t}${k === 'checks' && (nErr + nW) ? ` <i class="${nErr ? 'red' : 'amb'}">${nErr + nW}</i>` : ''}${k === 'photos' ? ` <i class="n">${(c.photos || []).length}</i>` : ''}</button>`).join('')}</div>
      <div class="tabbody">${body}</div></div>`;
  }

  function tabAssignment(c) {
    return group('Bank and report format', [
      input('bank', 'Bank / purpose', 'select', { options: VS.BANKS.map(b => b[0]) }),
      input('ptype', 'Property type', 'select', { options: VS.PTYPES }),
      input('cstatus', 'Construction status', 'select', { options: VS.CSTATUS }),
      input('fmtOverride', 'Report format', 'select', { options: VS.FORMATS, hint: '“Auto” follows the bank. Choose a format to override, e.g. BOI on the BOM format.' }),
      input('branch', 'Branch', 'text'), input('ref', 'Our reference no.', 'text')].join('')) +
      group('Dates', [input('assigned', 'Assigned on', 'date'), input('due', 'Report due by', 'date'), specField('inspect_date'), input('valDate', 'Date of valuation', 'date'), input('delivered', 'Delivered on', 'date')].join('')) +
      group('Purpose', specField('purpose', { wide: true })) +
      group('Fees', [input('fee', 'Fee', 'num', { unit: 'Rs' }), input('feeReceived', 'Received', 'num', { unit: 'Rs' }), input('billNo', 'Bill no.', 'text')].join(''));
  }
  function tabProperty(c) {
    const gm = VS.num(c.lat) && VS.num(c.lon) ? `<a class="lnk" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${VS.num(c.lat)},${VS.num(c.lon)}">Open in Google Maps ↗</a>` : '';
    const ph = (c.photos || []).find(p => p.lat && p.lon);
    return group('Owner and borrower', ['owner', 'owner_addr', 'borrower'].map(k => specField(k, { wide: k !== 'borrower' })).join('')) +
      group('Address', ['plot_no', 'survey_no', 'house_no', 'locality', 'town', 'district', 'area_use', 'loc_class', 'local_body', 'tenant', 'freehold'].map(k => specField(k)).join('')) +
      group('Boundaries as per deed', ['bN', 'bS', 'bE', 'bW'].map(k => specField(k)).join(''), 'Boundaries at site are taken as the same in the Excel report. Change them there if they differ.') +
      group('Location', input('lat', 'Latitude', 'num', { ph: '21.14' }) + input('lon', 'Longitude', 'num', { ph: '79.08' }) +
        `<div class="fld wide geo">${gm}${ph && !VS.num(c.lat) ? `<button class="btn" data-act="geo-from-photo">Use location from photo ${h(ph.caption || '')}</button>` : ''}<small>Photos taken with location turned on fill this in automatically.</small></div>`);
  }
  function tabLand(c, r, S) {
    const F = r.fmt;
    if (F.isFlat) return group('Land under the building', [specField('extent', { hint: 'Area of the entire plot' }), specField('undivided'), specField('glr_land')].join(''));
    const dimA = VS.num(c.f.dimN) * VS.num(c.f.dimE);
    return group('Plot', [specField('dimN'), specField('dimE'), specField('extent', { hint: dimA ? `Dimensions give ${VS.fmtN(dimA, 2)} sqm. <button class="mini" data-act="use-dim">Use it</button>` : 'Least of the deed area and the site area.' }), specField('shape'), specField('level'), specField('corner'), specField('development'), specField('approved_layout')].join('')) +
      group('Road and services', ['road_type', 'road_width', 'water', 'sewer', 'power'].map(k => specField(k)).join('')) +
      group('Rates', [specField('pmr'), specField('adopted', { hint: (F.fam === 'CAN' || F.fam === 'CBDT') ? `This format adopts ${Math.round(S.ladj * 100)}% of the prevailing rate: Rs ${VS.fmtN(VS.num(c.f.pmr) * S.ladj)}/sqft.` : 'Leave blank to use the prevailing rate.' }), specField('glr_land')].join(''));
  }
  function tabBuilding(c, r, S) {
    const fl = r.floors, F = r.fmt;
    const rowsF = [['bsmt', 'Basement', 'bsmt_area'], ['gf', 'Ground floor', 'gf_area'], ['ff', 'First floor', 'ff_area'], ['sf', 'Second floor', 'sf_area'], ['tf', 'Third floor', 'tf_area']];
    const tbl = `<div class="tblwrap"><table class="calc"><thead><tr><th>Floor</th><th>Area sqm</th><th>Rate Rs/sqft</th><th>Value</th></tr></thead><tbody>${rowsF.map(([k, nm, key]) => {
      const a = fl.area[k]; const auto = !VS.has(c.f[key]) && k !== 'gf' && k !== 'bsmt' && a;
      return `<tr><td>${nm}</td><td><input class="cell" data-k="f.${key}" data-num="1" inputmode="decimal" value="${h(c.f[key] ?? '')}" placeholder="${auto ? VS.fmtN(a, 2) + ' (same as GF)' : ''}" aria-label="${nm} area"></td><td class="num">${a ? VS.fmtN(fl.rate[k]) : ''}</td><td class="num">${a ? VS.rs(VS.round(a * 10.76 * fl.rate[k])) : ''}</td></tr>`;
    }).join('')}</tbody></table></div>`;
    return group('Building', ['tech', 'bldg_type', 'construction', 'year', 'upper_floors', 'condition', 'permission'].map(k => specField(k, k === 'tech' ? { hint: 'Leave blank for an existing building.' } : k === 'permission' ? { wide: true } : {})).join('') + (F.uc ? specField('stage') : '')) +
      group('Floor areas and rates', specField('gf_rate', { hint: `Upper floor rates follow the rules in Settings: first floor ${S.f1} × ground, each floor above × ${S.f2}.` }) + specField('glr_bldg') + `<div class="wide">${tbl}</div>`) +
      group('Extra items, amenities and services', SPEC.fields.filter(f => f.section === 'extra').map(f => specField(f.key)).join(''), 'Lump-sum values in rupees.');
  }
  function tabFlat(c, r) {
    return group('Flat', ['flat_no', 'flat_floor', 'bldg_floors', 'units', 'construction', 'year', 'lift', 'parking', 'marketability', 'permission'].map(k => specField(k)).join('') + (r.fmt.uc ? specField('stage') : '')) +
      group('Areas and rates', [specField('bua', { hint: r.bua ? `Super built-up ${VS.fmtN(r.sbua, 2)} sqm · carpet ${VS.fmtN(r.carpet, 2)} sqm` : '' }), specField('comp_rate'), specField('bldg_rate', { hint: 'Part of the composite rate for the building and services. It is depreciated by age.' }), specField('glr_land'), specField('glr_flat')].join(''));
  }
  function tabComps(c, r, S) {
    const cs = VS.comps(c, S), F = r.fmt;
    const rows = (c.comps || []).map((x, i) => {
      const k = cs.rows[i];
      return `<tr class="${k.outlier ? 'out' : ''}">
        <td><input class="cell" type="date" data-k="comps.${i}.date" value="${h(x.date || '')}" aria-label="Date"></td>
        <td><input class="cell w" data-k="comps.${i}.loc" value="${h(x.loc || '')}" aria-label="Location"></td>
        <td><input class="cell" data-num="1" inputmode="decimal" data-k="comps.${i}.area" value="${h(x.area ?? '')}" aria-label="Area"></td>
        <td><select class="cell" data-k="comps.${i}.unit" aria-label="Unit"><option ${x.unit !== 'sqm' ? 'selected' : ''}>sqft</option><option ${x.unit === 'sqm' ? 'selected' : ''}>sqm</option></select></td>
        <td><input class="cell" data-num="1" inputmode="decimal" data-k="comps.${i}.price" value="${h(x.price ?? '')}" aria-label="Price"></td>
        <td><input class="cell s" data-num="1" data-k="comps.${i}.adjLoc" value="${h(x.adjLoc ?? '')}" aria-label="Location adjustment %"></td>
        <td><input class="cell s" data-num="1" data-k="comps.${i}.adjSize" value="${h(x.adjSize ?? '')}" aria-label="Size adjustment %"></td>
        <td><input class="cell s" data-num="1" data-k="comps.${i}.adjOther" value="${h(x.adjOther ?? '')}" aria-label="Other adjustment %"></td>
        <td class="num">${k.valid ? VS.fmtN(k.rate) : ''}</td><td class="num">${k.valid ? '+' + (k.tAdj * 100).toFixed(1) + '%' : ''}</td>
        <td class="num"><b>${k.valid ? VS.fmtN(k.adjRate) : ''}</b>${k.outlier ? '<small>outlier</small>' : ''}</td>
        <td><input class="cell w" data-k="comps.${i}.src" value="${h(x.src || '')}" aria-label="Source"></td>
        <td><button class="mini" data-act="comp-del" data-i="${i}" aria-label="Remove">✕</button></td></tr>`;
    }).join('');
    const target = F.isFlat ? 'comp_rate' : 'adopted';

    return `<section class="grp"><h3>Comparable sale instances</h3><p class="note">Rates are brought to the valuation date at ${S.esc}% a year (Settings), then adjusted by your location, size and other percentages. An instance more than 2.5 robust standard deviations from the median is left out automatically once there are four or more.</p>

  function tabValuation(c, r, S) {

    const vary = (path, mult) => { const cc = JSON.parse(JSON.stringify(c)); const v = VS.num(get(cc, path)); if (!v) return null; set(cc, path, v * mult); const rr = VS.compute(cc, S); return F.uc ? rr.fmvNow : rr.fmv; };

  async function onClick(e) {

    if (b.dataset.tab) { st.tab = b.dataset.tab; st.view = 'case'; st.outmsg = ''; render(); window.scrollTo(0, 0); return; }

    const a = b.dataset.act; if (!a) return;

    if (a === 'dup') { const n = JSON.parse(JSON.stringify(c)); Object.assign(n, { id: uid(), ref: newCase().ref, status: 'Assigned', photos: [], created: new Date().toISOString(), example: false, delivered: '', fee: '', feeReceived: '', billNo: '' }); st.cases.push(n); st.caseId = n.id; touch(n); render(); return; }

  async function packCases(list, withPhotos) {
    const out = [];
    for (const c of list) {
      const cc = JSON.parse(JSON.stringify(c));
      cc.photos = [];
      for (const p of c.photos || []) {
        const q = Object.assign({}, p, { url: undefined });
        if (withPhotos) { try { const b = await Store.photoBlob(p); if (b) q.data = await VS.blobToDataURL(b); } catch (e) { } }
        cc.photos.push(q);
      }
      out.push(cc);
    }
    return out;
  }
  async function restore(file) {
    try {
      const j = JSON.parse(await file.text()); if (!j || !Array.isArray(j.cases)) throw new Error('This is not a Valuation Studio file.');
      let added = 0, updated = 0, kept = 0;
      for (const c of j.cases) {
        const have = st.cases.find(x => x.id === c.id);
        if (have && (have.updated || '') >= (c.updated || '')) { kept++; continue; }
        for (const p of c.photos || []) {
          if (p.data) { const b = await (await fetch(p.data)).blob(); Object.assign(p, await Store.savePhoto(b)); delete p.data; }
        }
        const upd = c.updated;
        if (have) { st.cases[st.cases.indexOf(have)] = c; updated++; } else { st.cases.push(c); added++; }
        await Store.put(c); c.updated = upd || c.updated;
      }
      if (j.settings && !(st.settings.profile && st.settings.profile.name)) { st.settings = Object.assign(st.settings, j.settings); await Store.putSettings(st.settings); }
      st.outmsg = `${added} case(s) added, ${updated} updated` + (kept ? `, ${kept} already up to date here.` : '.');
    } catch (e) { st.outmsg = 'Could not open the file: ' + e.message; }
    render();
  }

  /* ---------------- boot ---------------- */
  async function boot() {
    document.addEventListener('input', e => { if (e.target.id === 'q') { st.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); return; } if (e.target.type !== 'file') onField(e); });
    document.addEventListener('change', e => { if (e.target.type === 'file') onFiles(e); else onField(e); });
    document.addEventListener('click', onClick);
    $('#view').innerHTML = `<div class="empty"><b>Loading your cases…</b></div>`;
    const timer = setTimeout(() => { if (!st.loaded) { $('#view').innerHTML = `<div class="empty"><b>Your saved cases are taking long to load.</b><p>Check the connection and open the page again.</p></div>`; } }, 10000);
    await Store.init();
    try {
      st.cases = await Store.list();
      st.settings = (await Store.getSettings()) || { rules: {}, profile: {} };
      if (!st.settings.seeded && !st.cases.length) { const ex = exampleCase(); st.cases.push(ex); await Store.put(ex); st.settings.seeded = true; await Store.putSettings(st.settings); }
    } catch (e) { st.cases = []; st.settings = { rules: {}, profile: {} }; st.saving = 'Could not load saved cases: ' + e.message; }
    st.loaded = true; clearTimeout(timer);
    st.saving = Store.mode === 'cloud' ? 'Saved to your account' : 'Saved on this device';
    render();
  }
  VS.boot = boot;
})();
</script>
<script>VS.boot();</script>
<script>
(function(){
  window.VS_VERSION='202611050834';
  const bar=document.createElement('span');bar.id='pwabar';
  const top=document.querySelector('.top');top.insertBefore(bar,document.getElementById('savestate'));
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;show();});
  function show(){bar.innerHTML='';
    if(deferred){const b=document.createElement('button');b.className='btn primary';b.textContent='Install app';b.onclick=async()=>{deferred.prompt();await deferred.userChoice;deferred=null;show();};bar.appendChild(b);}
    if(window._vsWaiting){const u=document.createElement('button');u.className='btn';u.textContent='Update ready – reload';u.onclick=()=>window._vsWaiting.postMessage('skip');bar.appendChild(u);}
    const o=document.createElement('span');o.style.cssText='font-size:12px;color:var(--muted)';o.textContent=navigator.onLine?'':'Offline';bar.appendChild(o);}
  window.addEventListener('online',show);window.addEventListener('offline',show);show();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){window._vsWaiting=w;show();}});};
      if(reg.waiting&&navigator.serviceWorker.controller){window._vsWaiting=reg.waiting;show();}
      reg.addEventListener('updatefound',()=>watch(reg.installing));
      setInterval(()=>reg.update().catch(()=>{}),3600e3);
    }).catch(()=>{});
    let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload();}});
  }
})();
</script>
